databases:
  - name: agentpurse-db
    plan: free

services:
  - type: web
    name: agentpurse-api
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm -r run build
    startCommand: node api/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentpurse-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: MANDATE_SIGNING_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: BRAINTREE_ENV
        sync: false
      - key: BRAINTREE_MERCHANT_ID
        sync: false
      - key: BRAINTREE_PUBLIC_KEY
        sync: false
      - key: BRAINTREE_PRIVATE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false

  - type: web
    name: agentpurse-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm -r run build
    staticPublishPath: web/dist