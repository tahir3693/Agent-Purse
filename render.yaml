# Render Blueprint: API web service only. Postgres is external (DATABASE_URL secret).
# The web app is on Vercel.
services:
  - type: web
    name: agentpurse-api
    runtime: node
    plan: free
    healthCheckPath: /healthz
    # Install, generate the Prisma client BEFORE tsc, then build only the API and its
    # workspace dependencies (web/mobile are not built here).
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @agentpurse/api exec prisma generate && pnpm --filter "@agentpurse/api..." run build
    # preDeployCommand is paid-plan only, so migrations run at start (idempotent).
    startCommand: ./api/node_modules/.bin/prisma migrate deploy --schema api/prisma/schema.prisma && node api/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MANDATE_SIGNING_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: BRAINTREE_ENV
        sync: false
      - key: BRAINTREE_MERCHANT_ID
        sync: false
      - key: BRAINTREE_PUBLIC_KEY
        sync: false
      - key: BRAINTREE_PRIVATE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
